name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            runner: ubuntu-latest
            build_target: apk
            artifact_name: brainkandi-android
            artifact_path: android/app/build/outputs/apk/release/app-release.apk
          - platform: Linux
            runner: ubuntu-latest
            build_target: bundle-linux
            artifact_name: brainkandi-linux
            artifact_path: dist-linux
          - platform: iOS
            runner: macos-latest
            build_target: ipa
            artifact_name: brainkandi-ios
            artifact_path: .xcode-derived-data/Build/Products/Release-iphoneos/BrainKandi.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        if: matrix.platform == 'Android'
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .gradle
            .ccache
            .xcode-derived-data
            ios
            ~/.cache/electron
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ matrix.platform }}-build-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-build-

      - name: Build
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
