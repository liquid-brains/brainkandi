name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            runner: ubuntu-latest
            build_target: apk
            artifact_name: brainkandi-android
            artifact_path: android/app/build/outputs/apk/release/app-release.apk
          - platform: Linux
            runner: ubuntu-latest
            build_target: desktop
            artifact_name: brainkandi-linux
            artifact_path: dist-desktop/brainkandi-linux.tar.gz
          - platform: iOS
            runner: macos-latest
            build_target: ipa
            artifact_name: brainkandi-ios
            artifact_path: .xcode-derived-data/Build/Products/Release-iphoneos/BrainKandi.app
          - platform: Windows
            runner: windows-latest
            build_target: desktop
            artifact_name: brainkandi-windows
            artifact_path: dist-desktop/brainkandi-windows.zip
          - platform: macOS
            runner: macos-latest
            build_target: desktop
            artifact_name: brainkandi-macos
            artifact_path: dist-desktop/brainkandi-macos.zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        if: matrix.platform == 'Android'
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        if: matrix.platform == 'Android'
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses
          for attempt in 1 2 3; do
            if "$sdkmanager" --verbose \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0" \
              "ndk;27.1.12297006" \
              "cmake;3.22.1"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Android SDK installation failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Android SDK installation failed on attempt $attempt; retrying."
            sleep "$((attempt * 10))"
          done

      - name: Install ccache
        if: matrix.platform == 'Android'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache

      - name: Restore build caches
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .gradle
            .ccache
            .xcode-derived-data
            ios
            ~/.cache/electron
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ matrix.platform }}-build-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-build-

      - name: Build
        if: matrix.build_target != 'desktop'
        env:
          BUILD_TARGET: ${{ matrix.build_target }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: make

      - name: Build desktop app
        if: matrix.build_target == 'desktop'
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run package:desktop

      - name: Archive Linux app
        if: matrix.platform == 'Linux'
        run: tar -czf dist-desktop/brainkandi-linux.tar.gz -C dist-desktop BrainKandi-linux-x64

      - name: Archive Windows app
        if: matrix.platform == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist-desktop/BrainKandi-win32-* -DestinationPath dist-desktop/brainkandi-windows.zip

      - name: Archive macOS app
        if: matrix.platform == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist-desktop/BrainKandi-darwin-*/BrainKandi.app dist-desktop/brainkandi-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          archive: ${{ matrix.build_target != 'desktop' }}
          if-no-files-found: error
